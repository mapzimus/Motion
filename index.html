<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boston in Motion — everything moving in Boston, live</title>
  <meta name="description" content="Boston's MBTA rapid transit system tracked live on one map — every train and Silver Line bus, with service alerts and crowding from the MBTA V3 API.">
  <meta property="og:title" content="Boston in Motion">
  <meta property="og:description" content="The whole MBTA rapid transit system, tracked in real time.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23f4f6f8'/%3E%3Ctext x='16' y='23' font-family='Arial,sans-serif' font-size='20' font-weight='bold' text-anchor='middle' fill='%23111'%3ET%3C/text%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet"
        integrity="sha384-MinO0mNliZ3vwppuPOUnGa+iq619pfMhLVUXfC4LHwSCvF9H+6P/KO4Q7qBOYV5V" crossorigin="anonymous">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"
          integrity="sha384-SYKAG6cglRMN0RVvhNeBY0r3FYKNOJtznwA0v7B5Vp9tr31xAHsZC0DqkQ/pZDmj" crossorigin="anonymous"></script>

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div id="map"></div>

  <aside id="panel">
    <header class="panel-head">
      <div class="eyebrow">42.36°N / 71.06°W · REAL-TIME TELEMETRY</div>
      <h1>Boston<br><span class="grad">in Motion</span></h1>
      <p class="tagline">The whole MBTA rapid transit system, tracked live.</p>
    </header>

    <div class="panel-scroll">
      <section class="panel-section">
        <h2>Layers</h2>
        <div class="master-row line-row">
          <span class="bullet bullet-t">T</span>
          <span class="line-name">Subway</span>
          <label class="switch">
            <input type="checkbox" id="subway-master" checked aria-label="Toggle all subway lines">
            <span class="knob"></span>
          </label>
        </div>
        <div id="layer-rows"></div>

        <div class="modal-divider"></div>
        <div id="modal-rows"></div>

        <div class="future-rows">
          <div class="future-row"><span class="bullet ghost">≋</span><span class="line-name">Road traffic</span><span class="tag">soon</span></div>
        </div>
      </section>

      <section class="panel-section">
        <h2>Service alerts <span class="count-chip" id="alerts-count">0</span></h2>
        <ul id="alerts-list" class="alerts-list"></ul>
      </section>
    </div>

    <footer class="panel-foot">
      <div class="status-line">
        <span class="live-dot" id="status-dot"></span>
        <span id="status-text">CONNECTING…</span>
      </div>
      <div class="credits">
        Data <a href="https://www.mbta.com/developers/v3-api" target="_blank" rel="noopener">MBTA V3 API</a> ·
        Basemap © OSM / CARTO<br>
        Built by Max Howe · <a href="https://github.com/mapzimus" target="_blank" rel="noopener">github.com/mapzimus</a>
      </div>
    </footer>
  </aside>

  <button id="panel-toggle" aria-label="Toggle control panel">☰</button>

  <div id="overlay">
    <div class="radar"></div>
    <div id="overlay-text">CONTACTING MBTA…</div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
