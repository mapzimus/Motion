<!doctype html><html><head><meta charset="utf-8">
<!-- Road congestion in 3D from 511 traffic-flow snapshots (ne/rec-traffic.py -> ne/prep-traffic.py).
     Flat map + free-flow roads as a dim green texture; slow / jammed / stop-and-go cells rise as glowing columns.
     cfg (job.look + extraJson): proj, bg, traffic {index, base}, data = traffic-cells.json,
     warp [[sec, 'H:MM'], ...] (hours may pass 24 for later days), day0 (ms, midnight of day 1 ET), fps,
     cam [[sec, lon, lat, azDeg, tiltDeg, dist], ...] (Catmull-Rom through keys), colH {2,3,4} column heights, days ['Wed', ...] -->
<style>
  @font-face{font-family:PlexMono;src:url(/fonts/IBMPlexMono-Medium.ttf)}
  html,body{margin:0;background:#07080c;overflow:hidden;width:1080px;height:1920px}
  canvas{position:absolute;inset:0}
  #hud{position:absolute;left:96px;top:236px;font-family:PlexMono,monospace;color:#f3efe6;text-shadow:0 0 2px #000,0 0 2px #000}
  @font-face{font-family:PlexSerif;src:url(/fonts/IBMPlexSerif-Medium.ttf)}

  #cr{position:absolute;left:96px;bottom:40px;font-family:PlexMono,monospace;font-size:14px;color:rgba(243,239,230,.35)}
  #pct{font-size:24px;color:rgba(243,239,230,.85);margin-top:28px} #pct b{font-size:44px;color:#ffcf33;font-weight:500}
  #spark{position:absolute;inset:auto;left:96px;top:420px}
  #legend{position:absolute;left:96px;top:600px;font-family:PlexMono,monospace;font-size:22px;color:rgba(243,239,230,.8);line-height:1.7;text-shadow:0 0 2px #000,0 0 2px #000}

</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
</head><body>
<div id="hud"><div id="clk"></div><div id="day"></div><div id="pct"></div></div><canvas id="spark" width="888" height="150"></canvas><div id="note"></div><div id="line"></div><div id="cr"></div><div id="pin" class="pin"></div><div id="legend" style="display:none"><div><i style="background:#2ebe78"></i>flowing</div><div><i style="background:#ffcf33"></i>slow</div><div><i style="background:#ff3b22;height:22px;width:10px;margin:0 24px 0 10px"></i>jammed</div><div><i style="background:#ff1f6a;height:30px;width:10px;margin:0 24px 0 10px"></i>stop and go</div></div>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
const W = 1080, H = 1920;
const sm = (x) => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
const mins = (c) => { const p = String(c).split(':'); return +p[0] * 60 + +p[1] + (p[2] ? +p[2] / 60 : 0); };
window.__setup = async (cfg) => {
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1); renderer.setSize(W, H); document.body.prepend(renderer.domElement);
  const scene = new THREE.Scene(); scene.background = new THREE.Color('#0b0d12'); scene.fog = new THREE.Fog('#0b0d12', cfg.fogNear ?? 5000, cfg.fogFar ?? 11000);
  const cam = new THREE.PerspectiveCamera(cfg.fov ?? 34, W / H, 5, cfg.far ?? 1e6); cam.up.set(0, 0, 1);
  const P = cfg.proj, TW = P.w * P.dpr, TH = P.h * P.dpr, Z = 512 * Math.pow(2, P.zoom) * P.dpr;
  const mx = (lon) => (lon + 180) / 360, my = (lat) => { const r = lat * Math.PI / 180; return (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2; };
  const cx = mx(P.center[0]), cy = my(P.center[1]), toW = (lon, lat) => [(mx(lon) - cx) * Z, -(my(lat) - cy) * Z];
  const loadTex = async (u) => { const t = await new THREE.TextureLoader().loadAsync(u); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; };
  // ground + a water-coloured apron so the edge never shows
  const gmat = new THREE.MeshBasicMaterial({ map: await loadTex(cfg.bg), fog: true, color: new THREE.Color(cfg.groundTint ?? '#ffffff') });
  scene.add(new THREE.Mesh(new THREE.PlaneGeometry(TW, TH), gmat));
  // apron: the basemap's edge pixels stretched outward (texture clamps), so land stays land and ocean stays ocean past the frame
  const ag = new THREE.PlaneGeometry(TW * 40, TH * 40); { const uv = ag.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, (uv.getX(i) - 0.5) * 40 + 0.5, (uv.getY(i) - 0.5) * 40 + 0.5); }
  // a tiny copy of the basemap, so stretched edge pixels blur into soft land / water instead of road streaks
  const sc = document.createElement('canvas'); sc.width = 27; sc.height = 48; sc.getContext('2d').drawImage(gmat.map.image, 0, 0, 27, 48);
  const st = new THREE.CanvasTexture(sc); st.colorSpace = THREE.SRGBColorSpace;
  const apron = new THREE.Mesh(ag, new THREE.MeshBasicMaterial(cfg.apron ? { color: cfg.apron, fog: true } : { map: st, fog: true })); apron.position.z = -4; scene.add(apron);
  // traffic texture pair, crossfaded
  const TS = cfg.traffic.index, tcache = new Map();
  const tex = async (t) => { if (!tcache.has(t)) { tcache.set(t, await loadTex(`${cfg.traffic.base}${t}.png`)); while (tcache.size > 4) { const k = tcache.keys().next().value; tcache.get(k).dispose(); tcache.delete(k); } } return tcache.get(t); };
  const tmat = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, uniforms: { uA: { value: null }, uB: { value: null }, uMix: { value: 0 }, uG: { value: cfg.greenA ?? 0.55 } },
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `uniform sampler2D uA; uniform sampler2D uB; uniform float uMix; uniform float uG; varying vec2 vUv;
      void main(){ vec4 c = mix(texture2D(uA, vUv), texture2D(uB, vUv), uMix); float warm = step(0.7, c.a); gl_FragColor = vec4(c.rgb, c.a * mix(uG, 1.0, warm)); }` });
  const tp = new THREE.Mesh(new THREE.PlaneGeometry(TW, TH), tmat); tp.position.z = 0.5; scene.add(tp);
  // jam columns
  const C = cfg.data, CW = C.cell * TW / (C.w * C.cell), NMAX = cfg.maxCols ?? 30000;
  const colH = cfg.colH ?? { 2: 5, 3: 18, 4: 36 }, COL = { 2: new THREE.Color(cfg.cSlow ?? '#ffcf33'), 3: new THREE.Color(cfg.cJam ?? '#ff3b22'), 4: new THREE.Color(cfg.cStop ?? '#ff1f6a') };
  const box = new THREE.BoxGeometry(CW * 0.7, CW * 0.7, 1); box.translate(0, 0, 0.5);
  // brighter top, darker foot: vertex colour by height
  { const pos = box.attributes.position, c = []; for (let i = 0; i < pos.count; i++) { const v = 0.35 + 0.65 * pos.getZ(i); c.push(v, v, v); } box.setAttribute('color', new THREE.Float32BufferAttribute(c, 3)); }
  const cols = new THREE.InstancedMesh(box, new THREE.MeshBasicMaterial({ vertexColors: true, fog: true, transparent: true, opacity: 0.95 }), NMAX); cols.count = 0; scene.add(cols);
  const snapMap = C.snaps.map((s) => { const m = new Map(); for (let i = 0; i < s.length; i += 2) m.set(s[i], s[i + 1]); return m; });
  const M4 = new THREE.Matrix4(), col = new THREE.Color();
  // timing
  const fps = cfg.fps ?? 30, WP = cfg.warp.map(([s, c]) => [s, cfg.day0 + mins(c) * 60000]);
  const Tat = (s) => { if (s <= WP[0][0]) return WP[0][1]; for (let i = 0; i < WP.length - 1; i++) if (s <= WP[i + 1][0]) { const [s0, t0] = WP[i], [s1, t1] = WP[i + 1]; return s1 > s0 ? t0 + (t1 - t0) * (s - s0) / (s1 - s0) : t1; } return WP[WP.length - 1][1]; };
  window.__tmap = (n) => Array.from({ length: n }, (_, k) => Tat(k / fps));
  window.__win = [WP[0][1], WP[WP.length - 1][1]]; window.__peakInfo = { snaps: TS.length };
  // camera: Catmull-Rom through keys (lon, lat converted to world first)
  const K = cfg.cam.map(([s, lon, lat, az, ti, d]) => { const [x, y] = toW(lon, lat); return [s, x, y, az, ti, d]; });
  const camAt = (s) => { let i = 0; while (i < K.length - 2 && K[i + 1][0] <= s) i++; const a = K[Math.max(0, i - 1)], b = K[i], c = K[Math.min(K.length - 1, i + 1)], d = K[Math.min(K.length - 1, i + 2)];
    const u = c[0] > b[0] ? Math.min(1, Math.max(0, (s - b[0]) / (c[0] - b[0]))) : 0, u2 = u * u, u3 = u2 * u;
    return b.map((_, j) => j === 0 ? s : 0.5 * (2 * b[j] + (-a[j] + c[j]) * u + (2 * a[j] - 5 * b[j] + 4 * c[j] - d[j]) * u2 + (-a[j] + 3 * b[j] - 3 * c[j] + d[j]) * u3)); };
  const composer = new EffectComposer(renderer); composer.addPass(new RenderPass(scene, cam));
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), cfg.bloom ?? 0.85, cfg.bloomRadius ?? 0.45, cfg.bloomThreshold ?? 0.55)); composer.addPass(new OutputPass());
  const DAYS = cfg.days ?? ['Wed', 'Thu', 'Fri', 'Sat'];
  const clock = (T) => { const m = Math.floor((T - cfg.day0) / 60000), d = Math.floor(m / 1440), h = Math.floor(m / 60) % 24, mm = m % 60;
    const dl = cfg.house ? new Date(cfg.day0 + d * 86400000 + 43200000).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', timeZone: 'America/New_York' }).toLowerCase() : ((cfg.dayNames ?? DAYS)[d] ?? '');
    return [`${h % 12 || 12}:${String(mm).padStart(2, '0')} ${h < 12 ? 'am' : 'pm'}`, dl]; };
  const SS = new Map((cfg.traffic.stats ?? []).map(([t, a, b, c]) => [t, a + b + c]));
  const SP = (cfg.traffic.stats ?? []).filter(([t]) => t >= WP[0][1] && t <= WP[WP.length - 1][1]).map(([t, a, b, c]) => [t, a + b + c]), SMAX = Math.max(1e-6, ...SP.map((p) => p[1])) * 1.1;
  if (cfg.legend) document.getElementById('legend').style.display = 'block';
  if (cfg.house) { for (const id of ['pct', 'spark', 'note']) document.getElementById(id).style.display = 'none'; document.getElementById('hud').style.top = '236px'; }
  document.getElementById('cr').textContent = cfg.credit ?? '';
  // house lines: [[fromSec, toSec, text], ...] by video seconds, 0.4 s fades
  const LINES = cfg.lines ?? [];
  const spark = document.getElementById('spark'), NH = cfg.noteHold ?? 2.6, NMX = (cfg.noteMaxMin ?? 240) * 60000;
  // notes [['HH:MM', 'label', 'text'], ...]: find the video second each clock time is reached
  const NOTES = (cfg.notes ?? []).map(([c, lab, txt]) => { const t = cfg.day0 + mins(c) * 60000; let k = 0; while (Tat(k / fps) < t && k < 1e5) k++; return { t, s: k / fps, c: lab, txt }; });
  window.__frame = async (T, draw, k) => {
    if (!draw) return;
    const s = Math.max(0, (k ?? 0) / fps);
    let i = 0; while (i < TS.length - 2 && TS[i + 1] <= T) i++; const j = Math.min(i + 1, TS.length - 1), u = TS[j] > TS[i] ? sm((T - TS[i]) / (TS[j] - TS[i])) : 0;
    tmat.uniforms.uA.value = await tex(TS[i]); tmat.uniforms.uB.value = await tex(TS[j]); tmat.uniforms.uMix.value = u;
    const A = snapMap[i], B = snapMap[j]; let n = 0;
    const put = (cell, ca, cb) => { if (n >= NMAX) return; const h = (ca ? colH[ca] : 0) * (1 - u) + (cb ? colH[cb] : 0) * u; if (h < 0.5) return;
      const r = Math.floor(cell / C.w), q = cell % C.w, x = (q + 0.5) * CW - TW / 2, y = TH / 2 - (r + 0.5) * CW;
      M4.makeScale(1, 1, h).setPosition(x, y, 0.6); cols.setMatrixAt(n, M4); col.copy(COL[Math.max(ca || 0, cb || 0)]); cols.setColorAt(n, col); n++; };
    for (const [cell, ca] of A) put(cell, ca, B.get(cell));
    for (const [cell, cb] of B) if (!A.has(cell)) put(cell, 0, cb);
    cols.count = n; cols.instanceMatrix.needsUpdate = true; if (cols.instanceColor) cols.instanceColor.needsUpdate = true;
    const [, x, y, az, ti, d] = camAt(s), a = az * Math.PI / 180, t = ti * Math.PI / 180;
    cam.position.set(x + d * Math.sin(t) * Math.sin(a), y - d * Math.sin(t) * Math.cos(a), d * Math.cos(t)); cam.lookAt(x, y, 0);
    const [c1, c2] = clock(T); document.getElementById('clk').textContent = c1; document.getElementById('day').textContent = c2;
    // live share of road slow or worse, interpolated between snapshots, plus the day's curve drawn up to now
    const sA = SS.get(TS[i]), sB = SS.get(TS[j]), sh = sA && sB ? sA * (1 - u) + sB * u : 0;
    document.getElementById('pct').innerHTML = `<b>${(100 * sh).toFixed(1)}%</b> of mapped roads slow or jammed`;
    if (SP.length) { const g = spark.getContext('2d'), w = spark.width, h = spark.height, x = (t) => (t - SP[0][0]) / (SP[SP.length - 1][0] - SP[0][0]) * w, y = (v) => h - 6 - v / SMAX * (h - 18);
      g.clearRect(0, 0, w, h); g.strokeStyle = 'rgba(243,239,230,.18)'; g.lineWidth = 2; g.beginPath(); g.moveTo(0, h - 5); g.lineTo(w, h - 5); g.stroke();
      g.beginPath(); let on = false; for (const [t, v] of SP) { if (t > T) break; on ? g.lineTo(x(t), y(v)) : g.moveTo(x(t), y(v)); on = true; } if (on) { g.lineTo(x(T), y(sh)); g.strokeStyle = '#ffcf33'; g.lineWidth = 4; g.stroke(); g.fillStyle = '#ffcf33'; g.beginPath(); g.arc(x(T), y(sh), 7, 0, 7); g.fill(); } }
    // callouts: each appears once its clock time has passed and holds for noteHold seconds of video
    // a note also drops once the clock is noteMaxMin past it (overnight jumps), and the last note stays to the end
    let nt = null; NOTES.forEach((n, q) => { const last = q === NOTES.length - 1; if (T >= n.t && (last || (s < n.s + NH && T <= n.t + NMX))) nt = n; });
    const ne = document.getElementById('note'); if (nt) { const last = nt === NOTES[NOTES.length - 1], fo = last ? 1 : Math.min(sm((nt.s + NH - s) / 0.4), sm((nt.t + NMX - T) / (NMX * 0.15)));
      ne.innerHTML = `<small>${nt.c}</small>${nt.txt}`; ne.style.opacity = Math.min(sm((s - nt.s) / 0.4), fo); } else ne.style.opacity = 0;
    // pins [[fromSec, toSec, lon, lat, label]]: only while the camera is on that one place
    { const pe = document.getElementById('pin'), Pn = (cfg.pins ?? []).find(([a, b]) => s >= a && s < b);
      if (Pn) { cam.updateMatrixWorld(); const [px, py] = toW(Pn[2], Pn[3]), v = new THREE.Vector3(px, py, 40).project(cam);
        pe.textContent = Pn[4]; pe.style.left = `${(v.x + 1) / 2 * W}px`; pe.style.top = `${(1 - v.y) / 2 * H - 30}px`; pe.style.opacity = Math.min(sm((s - Pn[0]) / 0.4), sm((Pn[1] - s) / 0.4)); } else pe.style.opacity = 0; }
    if (LINES.length) { const le = document.getElementById('line'); const L = LINES.find(([a, b]) => s >= a && s < b);
      if (L) { le.textContent = L[2]; le.style.fontSize = `${L[3] ?? 38}px`; le.style.lineHeight = L[3] ? '1.15' : '1.3'; le.style.opacity = Math.min(sm((s - L[0]) / 0.4), sm((L[1] - s) / 0.4)); } else le.style.opacity = 0; }
    composer.render();
  };
};
</script></body></html>
