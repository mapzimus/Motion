name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # While Settings → Pages → Source is "Deploy from a branch", GitHub's own
      # "pages build and deployment" run publishes the raw repo (index.html
      # pointing at src/main.tsx, which never loads) on every push. Whichever
      # deploy finishes last is what the site serves, so wait for that run to
      # finish and land this one on top. A no-op once Source is "GitHub Actions".
      - name: Wait for GitHub's branch deploy so this one lands last
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const deadline = Date.now() + 8 * 60_000;
            for (;;) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: sha,
                per_page: 50,
              });
              const pending = data.workflow_runs.filter(
                (run) => run.name === 'pages build and deployment' && run.status !== 'completed',
              );
              if (!pending.length) break;
              if (Date.now() > deadline) {
                core.warning('Branch deploy still running after 8 minutes; deploying anyway.');
                break;
              }
              core.info(`Waiting on branch deploy run ${pending[0].id} (${pending[0].status})…`);
              await new Promise((resolve) => setTimeout(resolve, 10_000));
            }
      - id: deployment
        uses: actions/deploy-pages@v4
