name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Downloads every schedule feed and fails when a non-exempt feed stops
      # publishing service within seven days (see README "Verify changes").
      - run: python3 scripts/check-feed-freshness.py
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run deploy:dry-run
